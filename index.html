<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalp ❤️</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { display: grid; place-items: center; }
  canvas { display: block; width: min(100vw, 100vh); height: min(100vw, 100vh); max-width: 700px; max-height: 700px; }
</style>
</head>
<body>
<canvas id="heart" width="700" height="700" aria-label="Pembe parçacıklardan oluşan kalp"></canvas>
<script>
(() => {
  const canvas = document.getElementById("heart");
  const ctx = canvas.getContext("2d", { alpha: false });
  const W = 700, H = 700, cx = W / 2, cy = H / 2;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  function heart(a, scale) {
    const x = 16 * Math.sin(a) ** 3 * scale;
    const y = (13 * Math.cos(a) - 5 * Math.cos(2*a)
      - 2 * Math.cos(3*a) - Math.cos(4*a)) * scale;
    return [x, y];
  }

  // Precompute all particle strokes before animating.
  const particles = [];
  const rand = (min, max) => min + Math.random() * (max - min);

  for (let i = 0; i < 10000; i++) {
    const a = rand(0, 2 * Math.PI);
    const scale = rand(0.5, 15.5);
    const [x, y] = heart(a, scale);
    const angle = Math.atan2(y, x) + rand(-0.56, 0.5);
    const length = rand(4, 14);
    particles.push({
      x1: cx + x, y1: cy - y,
      x2: cx + x + length * Math.cos(angle),
      y2: cy - y - length * Math.sin(angle),
      color: `rgb(255,${Math.round(rand(64,140))},${Math.round(rand(166,217))})`,
      width: rand(0.5, 1.2)
    });
  }

  for (let i = 0; i < 3500; i++) {
    const a = rand(0, 2 * Math.PI);
    const [x, y] = heart(a, 16.0);
    const angle = Math.atan2(y, x) + rand(-0.35, 0.35);
    const length = rand(10, 32);
    const x1 = cx + x + rand(-2, 2);
    const y1 = cy - y + rand(-2, 2);
    particles.push({
      x1, y1,
      x2: x1 + length * Math.cos(angle),
      y2: y1 - length * Math.sin(angle),
      color: `rgb(255,${Math.round(rand(115,191))},${Math.round(rand(191,242))})`,
      width: rand(0.5, 0.9)
    });
  }

  // Draw in batches so the page stays responsive during the animation.
  let index = 0;
  const batchSize = 100;
  function frame() {
    const end = Math.min(index + batchSize, particles.length);
    for (; index < end; index++) {
      const p = particles[index];
      ctx.beginPath();
      ctx.moveTo(p.x1, p.y1);
      ctx.lineTo(p.x2, p.y2);
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.width;
      ctx.stroke();
    }
   if (index < particles.length) {
    setTimeout(frame, 80);
}
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
